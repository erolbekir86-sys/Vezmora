[project]
name = "vezmora"
version = "0.6.1"
description = "Vezmora 0.6.1 Private Beta - deployment-ready autonomous marketing intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai-agents>=0.4.0",
  "pydantic>=2.8.0",
  "email-validator>=2.2.0",
  "httpx>=0.27.0",
  "cryptography>=43.0.0",
  "stripe>=15.4.0,<16",
  "turso_serverless",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"
