name: Vexmera CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vexmera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q app main.py scripts
      - name: Check frontend JavaScript
        run: |
          node --check static/app.js
          node --check static/app-polish.js
          node --check static/account-privacy-ui.js
          node --check static/analytics-consent.js
          node --check static/landing.js
      - name: Test
        run: pytest -q
