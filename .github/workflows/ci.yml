name: Vexmera CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vexmera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Verify Chromium for mobile browser QA
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chromium/Chrome executable available for the 390x844 browser QA gate" >&2
            exit 1
          fi
      - name: Compile Python
        run: python -m compileall -q app main.py scripts
      - name: Check frontend JavaScript
        run: |
          find static -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Scan tracked files for committed secrets
        run: python scripts/check_secret_leaks.py
      - name: Test
        run: pytest -q
