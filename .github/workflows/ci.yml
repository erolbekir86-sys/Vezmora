name: Vexmera CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vexmera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q app main.py scripts
      - name: Check frontend JavaScript
        run: |
          find static -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Test
        run: pytest -q
